server:
  port: ${PORT:8085}

spring:
  application:
    name: connectnow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/connectnow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
      enabled: true

connectnow:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjdXJlLWtleS1mb3ItY29ubmVjdG5vdy13aGF0c2FwcC1zdHlsZS1hcHAtMjAyNA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  files:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 25MB

logging:
  level:
    com.connectnow: INFO
    org.springframework.security: WARN
    org.springframework.web.socket: INFO
