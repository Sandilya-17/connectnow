version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: connectnow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connectnow_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-connectnow}
      MYSQL_USER: ${MYSQL_USER:-connectnow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-connectnow_pass_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - connectnow-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connectnow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/connectnow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-connectnow_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-connectnow_pass_2024}
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JWT_SECRET: ${JWT_SECRET:-c3VwZXItc2VjdXJlLWtleS1mb3ItY29ubmVjdG5vdy13aGF0c2FwcC1zdHlsZS1hcHAtMjAyNA==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://frontend:80
    ports:
      - "8085:8085"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - connectnow-network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: connectnow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - connectnow-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  connectnow-network:
    driver: bridge
